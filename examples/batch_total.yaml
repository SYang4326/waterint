continue_on_error: false

output:
  summary: batch_output/summary.json

tasks:
  - name: density_{id}
    module: density
    repeat:
      - id: xyz
        config: density_xyz/config_oxygen_species.yaml
      - id: lammpstrj
        config: density_lammpstrj/config_oxygen_species.yaml

  - name: hbond_small
    module: hbond
    config: hbond_lammpstrj/config.yaml

  - name: sfg_small
    module: sfg
    config: sfg_trajectory/config.yaml
