input:
  trajectory: input/small.lammpstrj
  format: lammpstrj
  type_map:
    1: H
    2: O
    3: Mg

system:
  cell: auto

selection:
  mode: oxygen_species
  oxygen_species: ["O2-", "H2O"]
  oxygen_symbol: O
  hydrogen_symbol: H
  oh_cutoff: 1.25

coordinate:
  mode: relative_to_slab
  axis: z
  reference:
    type: slab_surface
    species: ["Mg"]
    surface: max
  range: [0.0, 10.0]
  bins: 20

normalization:
  type: number_density

output:
  directory: output
  prefix: density_lammpstrj_oxygen_species
  plot: true
