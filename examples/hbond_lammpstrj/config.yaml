input:
  trajectory: input/small_hbond.lammpstrj
  format: lammpstrj
  type_map:
    1: H
    2: O

system:
  cell: auto

selection:
  oxygen_species: ["H2O"]
  oxygen_symbol: O
  hydrogen_symbol: H
  oh_cutoff: 1.25
  neighbor_method: auto
  neighbor_workers: 1

hbond:
  oo_cutoff: 3.5
  dha_angle_min: 150.0
  h_acceptor_cutoff:
  max_acceptors_per_hydrogen: true
  pbc: [false, false, false]

output:
  directory: output
  prefix: hbond_topology
  plot: true
  title: "H-bond topology fractions"
