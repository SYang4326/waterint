input:
  trajectory: /Users/mapple/Desktop/LifeOS/20_projects/water-interface-analysis-site/test/dump.MgO_water_2x2_equil.last100ps.unique.waterint.npz
  format: npz
  type_map:
    1: H
    2: Mg
    3: O
  max_frames: all
  stride: 1

system:
  cell: auto

selection:
  oxygen_species: ["OH-", "H2O", "H3O+"]
  oxygen_symbol: O
  hydrogen_symbol: H
  oh_cutoff: 1.25
  neighbor_method: auto
  neighbor_workers: 1

coordinate:
  mode: relative_to_slab
  axis: z
  reference:
    type: slab_surface
    species: ["Mg"]
    surface: max
  range: [-1.0, 8.0]
  bins: 180

angle:
  range: [0.0, 180.0]
  bins: 180
  axis_sign: 1

normalization:
  type: counts_per_frame

output:
  directory: /Users/mapple/Desktop/LifeOS/20_projects/waterint/examples/mgo_angle_z/output
  prefix: mgo_oh_h2o_h3o_angle_z
  plot: true
  log: true
  style: imshow
  orientation: angle_z
  figure_preset: sharedz
  colorbar_mode: top
  colormap_style: convention
  yaxis_side: right
  show_y_label: true
  display_z_max: 8.0
  colorbar_height: 0.34
  colorbar_width_px: 28
  colorbar_x_px: 910
  colorbar_center: 0.50
  colorbar_top_pad_px: 24
  colorbar_top_height_px: 28
  colorbar_tick_size: 8
  colorbar_title_size: 9
  hide_first_colorbar_tick_label: true
  invert_angle_axis: false
  smooth_sigma: 0.9
  cmap: turbo
  title: ""
  z_label: "z' (Å)"
