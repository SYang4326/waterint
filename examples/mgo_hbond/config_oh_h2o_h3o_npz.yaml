input:
  trajectory: /Users/mapple/Desktop/LifeOS/20_projects/water-interface-analysis-site/test/dump.MgO_water_2x2_equil.last100ps.unique.waterint.npz
  format: npz
  type_map:
    1: H
    2: Mg
    3: O
  max_frames: 80
  stride: 1

system:
  cell: auto

selection:
  oxygen_species: ["OH-", "H2O", "H3O+"]
  oxygen_symbol: O
  hydrogen_symbol: H
  oh_cutoff: 1.25
  neighbor_method: auto
  neighbor_workers: 1

hbond:
  oo_cutoff: 3.5
  dha_angle_min: 150.0
  h_acceptor_cutoff:
  max_acceptors_per_hydrogen: true
  pbc: [true, true, false]
  classes_by_species:
    OH-: ["DAAA", "DAA", "DA", "AAA", "AA", "A", "other"]
    H2O: ["DDAA", "DDA", "DAA", "DA", "AA", "A", "other"]
    H3O+: ["DDDA", "DDD", "DDA", "DD", "DA", "D", "other"]

output:
  directory: /Users/mapple/Desktop/LifeOS/20_projects/waterint/examples/mgo_hbond/output
  prefix: mgo_oh_h2o_h3o_hbond
  plot: true
  show_empty_species: false
  title: "H-bond topology fractions"
