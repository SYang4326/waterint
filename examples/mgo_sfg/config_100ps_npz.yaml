input:
  trajectory: /Users/mapple/Desktop/LifeOS/20_projects/water-interface-analysis-site/test/dump.MgO_water_2x2_equil.last100ps.unique.waterint.npz
  format: npz
  type_map:
    1: H
    2: Mg
    3: O
  max_frames: 2000
  stride: 1

system:
  cell: auto

sfg:
  mode: trajectory
  hydrogen_symbol: H
  oxygen_symbol: O
  dt_ps: 0.005
  lag_ps: 0.995
  pbc: [true, true, false]
  reference:
    species: ["Mg"]
    surface: max
  window:
    mode: 1
    z1: 0.0
    z2: 8.0
    ramp: 0.5
    flip: true
  mu_mode: full
  symmetrize: true
  sticky_A: 0.0
  nzeros: 2000

output:
  directory: /Users/mapple/Desktop/LifeOS/20_projects/waterint/examples/mgo_sfg/output
  prefix: mgo_100ps_sfg_test2000
  plot: true
  xmin: 0.0
  xmax: 4500.0
  flip: true
  title: "MgO-water SFG test, first 2000 frames"
