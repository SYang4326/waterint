input:
  trajectory: /Users/mapple/Desktop/LifeOS/20_projects/water-interface-analysis-site/test/spinel-mgal2o4-100-term01/seed_01_bulk4x_2x2/02_SIM_OUTPUT/dump.symmetrix_mh0.lammpstrj
  format: lammpstrj
  # Type mapping from metadata.json / structure.data:
  # 1 H, 2 O, 3 Mg, 4 Al
  type_map:
    1: H
    2: O
    3: Mg
    4: Al
  # Production-style sampling: use all frames from timestep >= 100000.
  start_timestep: 100000
  max_frames: all
  stride: 1

system:
  # auto reads cell lengths from LAMMPS BOX BOUNDS.
  cell: auto

selection:
  mode: oxygen_species
  oxygen_species: ["OH-", "H2O"]
  oxygen_symbol: O
  hydrogen_symbol: H
  oh_cutoff: 1.25
  neighbor_method: auto
  neighbor_workers: 1

coordinate:
  mode: relative_to_slab
  axis: z
  reference:
    type: slab_surface
    species: ["Mg", "Al"]
    surface: max
  range: [0.0, 18.0]
  bins: 180

normalization:
  type: mass_density
  unit: g/cm^3

output:
  directory: /Users/mapple/Desktop/LifeOS/20_projects/waterint/examples/spinel_mgal2o4_density/output
  prefix: spinel_mgal2o4_oh_h2o_density
  plot: true
  title: "OH- and H2O density relative to spinel slab"
