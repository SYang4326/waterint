[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "waterint"
version = "0.7.0.dev0"
description = "Config-driven analysis tools for water-containing molecular simulations."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "numpy",
  "scipy",
  "matplotlib",
  "PyYAML",
]

[project.optional-dependencies]
transport = ["stacie>=1.2"]

[project.scripts]
waterint = "waterint.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["waterint*"]

[tool.setuptools.package-data]
waterint = ["system/profiles/*.yaml", "backends/cpu/*.cpp", "backends/cpu/*.hpp", "backends/gpu/*.cu"]
