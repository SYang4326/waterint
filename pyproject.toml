[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "waterint"
version = "0.1.0"
description = "Config-driven analysis tools for water-containing molecular simulations."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "numpy",
  "scipy",
  "matplotlib",
  "PyYAML",
]

[project.scripts]
waterint = "waterint.cli:main"

[tool.setuptools.packages.find]
include = ["waterint*"]
