input:
  trajectory: ../shared/input/dump.MgO_water_2x2_equil.last100ps.unique.waterint.npz
  format: npz
  type_map:
    1: H
    2: Mg
    3: O
  max_frames: 200
  stride: 1

system:
  cell: auto

sfg:
  mode: trajectory
  backend: auto
  velocity_source: auto
  hydrogen_symbol: H
  oxygen_symbol: O
  oh_assignment: nearest_oxygen
  dt_ps: 0.005
  lag_ps: 0.2
  pbc: [true, true, false]
  reference:
    species: [Mg]
    surface: max
  layer_bins:
    - label: 0_1d5
      window: {mode: 2, z1: 0.0, z2: 1.5, ramp: 0.0}
    - label: 1d5_2d8
      window: {mode: 2, z1: 1.5, z2: 2.8, ramp: 0.0}
    - label: 2d8_4d0
      window: {mode: 2, z1: 2.8, z2: 4.0, ramp: 0.0}
    - label: all
  species_channels: [OH-]
  mu_mode: full
  symmetrize: true
  nzeros: 2000

output:
  directory: output
  prefix: ssvvcf
  run_label: quick200
  plot: true
  xmin: 0.0
  xmax: 4500.0
  flip: true
  title: MgO-water layer and hydroxide SFG quick example
