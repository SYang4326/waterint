input:
  trajectory: ../shared/input/dump.MgO_water_2x2_equil.last100ps.unique.waterint.npz
  format: npz
  type_map: {1: H, 2: Mg, 3: O}
  stride: 1
  max_frames: all

system: {cell: auto}

selection:
  oxygen_species: [OH-]
  oxygen_symbol: O
  hydrogen_symbol: H
  hydrogen_assignment: nearest
  oh_cutoff: 1.25

defect_tracking:
  timestep_ps: 0.005
  gate_A: 3.0
  pbc: [true, true, false]
  layer:
    coordinate:
      mode: relative_to_slab
      axis: z
      reference: {type: top_layer_mean, species: [Mg], surface: max, layer_width: 0.7}
    range: [-0.5, 4.0]

defect_msd:
  dimensionality: 2d
  plane_normal_axis: z
  max_lag_frames: 2000
  origin_stride: 10

defect_conductivity:
  estimator: both
  temperature_K: 300.0
  charge_e: -1.0
  fit_range_ps: [2.0, 8.0]
  volume: {mode: slab, normal_axis: z, thickness_A: 4.5}

output:
  directory: output/oh_dynamic
  prefix: oh_dynamic_transport
  plot: true
  title: Dynamic OH defect MSD and conductivity
