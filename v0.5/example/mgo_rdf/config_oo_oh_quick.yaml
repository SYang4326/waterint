input:
  trajectory: ../shared/input/dump.MgO_water_2x2_equil.last100ps.unique.waterint.npz
  format: npz
  type_map:
    1: H
    2: Mg
    3: O
  max_frames: 100
  stride: 1

system:
  cell: auto

rdf:
  backend: auto
  r_max: 8.0
  bins: 160
  pbc: [true, true, true]

output:
  directory: output
  prefix: mgo_oo_oh_rdf_quick
  plot: true
  title: MgO-water O-O and O-H RDFs
