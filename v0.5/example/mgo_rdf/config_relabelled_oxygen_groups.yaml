input:
  trajectory: ../shared/input/dump.MgO_water_2x2_equil.last100ps.unique.waterint.npz
  format: npz
  type_map: {1: H, 2: Mg, 3: O}
  # Sample every tenth saved frame: 2,001 frames across the full 100 ps window.
  # Set stride: 1 for the full 20,001-frame calculation.
  max_frames: all
  stride: 10

system: {cell: auto}

# Labels are evaluated independently in every frame. O2- denotes lattice O
# under the O-H coordination convention; water/OH groups use their O-H label
# and position relative to the instantaneous Mg surface.
rdf:
  backend: auto
  r_max: 8.0
  bins: 200
  pbc: [true, true, false]
  pairs:
    - name: Mg-O
      first: {elements: [Mg]}
      second: {elements: [O]}
    - name: Mg-H
      first: {elements: [Mg]}
      second: {elements: [H]}
    - name: lattice_O-O
      first: {oxygen_species: [O2-], oxygen_symbol: O, hydrogen_symbol: H, oh_cutoff: 1.25, hydrogen_assignment: nearest, pbc: [true, true, false]}
      second: {elements: [O]}
    - name: lattice_O-H
      first: {oxygen_species: [O2-], oxygen_symbol: O, hydrogen_symbol: H, oh_cutoff: 1.25, hydrogen_assignment: nearest, pbc: [true, true, false]}
      second: {elements: [H]}
    - name: layer1_OH-O
      first:
        oxygen_species: [OH-]
        oxygen_symbol: O
        hydrogen_symbol: H
        oh_cutoff: 1.25
        hydrogen_assignment: nearest
        pbc: [true, true, false]
        layer: &layer1
          coordinate:
            mode: relative_to_slab
            axis: z
            reference: {type: slab_surface, species: [Mg], surface: max}
          range: [0.7, 2.5]
      second: {elements: [O]}
    - name: layer1_OH-H
      first:
        oxygen_species: [OH-]
        oxygen_symbol: O
        hydrogen_symbol: H
        oh_cutoff: 1.25
        hydrogen_assignment: nearest
        pbc: [true, true, false]
        layer: *layer1
      second: {elements: [H]}
    - name: layer1_H2O-O
      first:
        oxygen_species: [H2O]
        oxygen_symbol: O
        hydrogen_symbol: H
        oh_cutoff: 1.25
        hydrogen_assignment: nearest
        pbc: [true, true, false]
        layer: *layer1
      second: {elements: [O]}
    - name: layer1_H2O-H
      first:
        oxygen_species: [H2O]
        oxygen_symbol: O
        hydrogen_symbol: H
        oh_cutoff: 1.25
        hydrogen_assignment: nearest
        pbc: [true, true, false]
        layer: *layer1
      second: {elements: [H]}
    - name: layer2_OH-O
      first:
        oxygen_species: [OH-]
        oxygen_symbol: O
        hydrogen_symbol: H
        oh_cutoff: 1.25
        hydrogen_assignment: nearest
        pbc: [true, true, false]
        layer: &layer2
          coordinate:
            mode: relative_to_slab
            axis: z
            reference: {type: slab_surface, species: [Mg], surface: max}
          range: [2.5, 4.0]
      second: {elements: [O]}
    - name: layer2_OH-H
      first:
        oxygen_species: [OH-]
        oxygen_symbol: O
        hydrogen_symbol: H
        oh_cutoff: 1.25
        hydrogen_assignment: nearest
        pbc: [true, true, false]
        layer: *layer2
      second: {elements: [H]}
    - name: bulk_H2O-O
      first:
        oxygen_species: [H2O]
        oxygen_symbol: O
        hydrogen_symbol: H
        oh_cutoff: 1.25
        hydrogen_assignment: nearest
        pbc: [true, true, false]
        layer: &bulk
          coordinate:
            mode: relative_to_slab
            axis: z
            reference: {type: slab_surface, species: [Mg], surface: max}
          range: [4.0, 30.0]
      second: {elements: [O]}
    - name: bulk_H2O-H
      first:
        oxygen_species: [H2O]
        oxygen_symbol: O
        hydrogen_symbol: H
        oh_cutoff: 1.25
        hydrogen_assignment: nearest
        pbc: [true, true, false]
        layer: *bulk
      second: {elements: [H]}

output:
  directory: output/relabelled_rdf
  prefix: mgo_relabelled_oxygen_rdf
  plot: true
  plot_mode: separate
  title: Relabelled oxygen-group RDFs
