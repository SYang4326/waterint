input:
  trajectory: ../shared/input/dump.MgO_water_2x2_equil.last100ps.unique.waterint.npz
  format: npz
  type_map:
    1: H
    2: Mg
    3: O
  max_frames: all
  stride: 1

system:
  cell: auto

# Select O atoms. The optional layer below is evaluated on the first frame,
# then the same atom identities are followed for every MSD time origin.
selection:
  elements:
    - O

msd:
  backend: auto
  timestep_ps: 0.005
  dimensionality: "2d"
  plane_normal_axis: z
  pbc:
    - true
    - true
    - false
  max_lag_frames: 2000
  origin_stride: 10
  layer:
    coordinate:
      mode: relative_to_slab
      axis: z
      reference:
        type: slab_surface
        species:
          - Mg
        surface: max
    range:
      - 0.0
      - 4.0

output:
  directory: output
  prefix: mgo_interfacial_o_msd_2d
  plot: true
  title: Interfacial oxygen 2D MSD
