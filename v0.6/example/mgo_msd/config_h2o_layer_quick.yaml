input:
  trajectory: ../shared/input/dump.MgO_water_2x2_equil.last100ps.unique.waterint.npz
  format: npz
  type_map:
    1: H
    2: Mg
    3: O
  max_frames: 200
  stride: 1

system:
  cell: auto

selection:
  elements: [O]

msd:
  backend: auto
  timestep_ps: 0.005
  dimensionality: "2d"
  plane_normal_axis: z
  pbc: [true, true, false]
  max_lag_frames: 80
  origin_stride: 1
  layer:
    coordinate:
      mode: relative_to_slab
      axis: z
      reference:
        type: slab_surface
        species: [Mg]
        surface: max
    range: [0.0, 4.0]

output:
  directory: output
  prefix: mgo_interfacial_o_msd_2d_quick
  plot: true
  title: Interfacial oxygen 2D MSD
