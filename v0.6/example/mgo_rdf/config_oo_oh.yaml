input:
  trajectory: ../shared/input/dump.MgO_water_2x2_equil.last100ps.unique.waterint.npz
  format: npz
  type_map:
    1: H
    2: Mg
    3: O
  max_frames: all
  stride: 1

system:
  cell: auto

# Standard O-O and O-H RDFs are the default when rdf.pairs is omitted.
# Pairs below additionally demonstrate species- and layer-selective RDFs.
rdf:
  backend: auto
  r_max: 8.0
  bins: 200
  pbc:
    - true
    - true
    - true
  pairs:
    - name: O-O
      first:
        elements:
          - O
      second:
        elements:
          - O
    - name: O-H
      first:
        elements:
          - O
      second:
        elements:
          - H
    - name: H2O-OH interfacial
      first:
        oxygen_species:
          - H2O
        oxygen_symbol: O
        hydrogen_symbol: H
        oh_cutoff: 1.25
        hydrogen_assignment: nearest
        pbc: [true, true, true]
        layer:
          coordinate:
            mode: relative_to_slab
            axis: z
            reference:
              type: slab_surface
              species:
                - Mg
              surface: max
          range: [0.0, 4.0]
      second:
        oxygen_species:
          - OH-
        oxygen_symbol: O
        hydrogen_symbol: H
        oh_cutoff: 1.25
        hydrogen_assignment: nearest
        pbc: [true, true, true]
        layer:
          coordinate:
            mode: relative_to_slab
            axis: z
            reference:
              type: slab_surface
              species:
                - Mg
              surface: max
          range: [0.0, 4.0]

output:
  directory: output
  prefix: mgo_oo_oh_rdf
  plot: true
  title: MgO-water radial distribution functions
