input:
  trajectory: ../shared/input/dump.MgO_water_2x2_equil.last100ps.unique.waterint.npz
  format: npz
  type_map:
    1: H
    2: Mg
    3: O
  max_frames: all
  stride: 1

system:
  cell: auto

sfg:
  mode: trajectory
  hydrogen_symbol: H
  oxygen_symbol: O
  oh_cutoff: 1.25
  duplicate_hydrogen_policy: nearest
  dt_ps: 0.005
  lag_ps: 0.995
  pbc:
    - true
    - true
    - false
  reference:
    species:
      - Mg
    surface: max
  window:
    mode: 1
    z1: 0.0
    z2: 8.0
    ramp: 0.5
    flip: true
  mu_mode: full
  symmetrize: true
  sticky_A: 0.0
  nzeros: 2000

output:
  directory: output
  prefix: mgo_100ps_sfg_full
  plot: true
  xmin: 0.0
  xmax: 4500.0
  flip: true
  title: MgO-water SFG, 100 ps
