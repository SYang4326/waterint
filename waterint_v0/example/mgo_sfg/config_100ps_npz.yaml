input:
  trajectory: ../shared/input/dump.MgO_water_2x2_equil.last100ps.unique.waterint.npz
  format: npz
  type_map:
    1: H
    2: Mg
    3: O
  max_frames: 200
  stride: 1
system:
  cell: auto
sfg:
  mode: trajectory
  hydrogen_symbol: H
  oxygen_symbol: O
  dt_ps: 0.005
  lag_ps: 0.995
  pbc:
  - true
  - true
  - false
  reference:
    species:
    - Mg
    surface: max
  window:
    mode: 1
    z1: 0.0
    z2: 8.0
    ramp: 0.5
    flip: true
  mu_mode: full
  symmetrize: true
  sticky_A: 0.0
  nzeros: 2000
output:
  directory: output
  prefix: mgo_100ps_sfg_quick200
  plot: true
  xmin: 0.0
  xmax: 4500.0
  flip: true
  title: MgO-water SFG quick example, first 200 frames
